services:
  jarvis:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        # Reads BROWSER_ENABLED from .env. Chromium is only installed into the
        # image when this is true, so turning the feature on means a rebuild:
        # bash scripts/update.sh
        BROWSER_ENABLED: ${BROWSER_ENABLED:-false}
    container_name: jarvis
    restart: unless-stopped
    env_file: .env
    environment:
      # Point search at the bundled SearXNG rather than scraping DuckDuckGo.
      SEARXNG_URL: http://searxng:8080
      # Where the self-improvement engine works. Only meaningful with the
      # repo mount that scripts/self-improve.sh adds.
      AUTONOMY_REPO_PATH: /app/repo
      # The markdown vault, as the container sees it. The host side is
      # NOTES_HOST_DIR below; only this path ever appears in .env.
      NOTES_DIR: ${NOTES_DIR:-/notes}
    # Docker's default 64MB of shared memory makes Chromium crash on heavy pages.
    # Harmless when the browser is off; costs nothing until used.
    shm_size: 256m
    volumes:
      - jarvis-data:/data
      # Your notes. Defaults to ./notes in this checkout so the feature works
      # with nothing configured; point NOTES_HOST_DIR at an Obsidian vault (or
      # any folder of .md files) in .env to use that instead. Read-write,
      # because "remember that…" writes a new note.
      - ${NOTES_HOST_DIR:-./notes}:/notes:rw
      # Self-improvement needs a real git repo to branch and commit in, and the
      # image deliberately doesn't contain .git. `bash scripts/self-improve.sh`
      # adds that mount via docker-compose.override.yml — don't add it here, as
      # this file is tracked and a local edit collides with every update.
    ports:
      # Bound to localhost: Caddy terminates TLS and proxies in. Never expose
      # 8000 straight to the internet — the whole app is behind one password.
      - "127.0.0.1:8000:8000"
    depends_on:
      - searxng

  searxng:
    image: searxng/searxng:latest
    container_name: jarvis-searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng:/etc/searxng:rw
    expose:
      - "8080"

  # OmniRoute: a local AI gateway in front of a large catalogue of providers,
  # sitting behind Jarvis's own pool as one more endpoint. Opt-in via the
  # "omniroute" profile — `bash scripts/omniroute.sh` turns it on, and writes
  # COMPOSE_PROFILES=omniroute to .env so every later `docker compose up -d`
  # keeps it. See docs/omniroute.md.
  #
  # Reachable two ways, on purpose: the Jarvis container talks to it as
  # http://omniroute:20128/v1 over the compose network, and the dashboard is
  # published on this host's loopback only, for an SSH tunnel. Nothing here is
  # reachable from the internet — REQUIRE_API_KEY is off, so that is the only
  # thing standing between the world and an anonymous LLM proxy.
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: jarvis-omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    profiles: ["omniroute"]
    environment:
      NODE_ENV: production
      PORT: "20128"
      HOSTNAME: 0.0.0.0
      DATA_DIR: /app/data
      # Its three required secrets, generated by scripts/omniroute.sh and kept
      # in .env under their own names so they cannot be confused with ours.
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET:-}
      API_KEY_SECRET: ${OMNIROUTE_API_KEY_SECRET:-}
      INITIAL_PASSWORD: ${OMNIROUTE_PASSWORD:-}
      OMNIROUTE_WS_BRIDGE_SECRET: ${OMNIROUTE_WS_BRIDGE_SECRET:-}
      REQUIRE_API_KEY: "false"
      # Where its own links and OAuth callbacks point. Through the tunnel the
      # dashboard is localhost:20128 on your Mac, which is what these say.
      BASE_URL: http://localhost:20128
      NEXT_PUBLIC_BASE_URL: http://localhost:20128
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      - omniroute-data:/app/data

  caddy:
    image: caddy:2-alpine
    container_name: jarvis-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - jarvis

volumes:
  jarvis-data:
  caddy-data:
  caddy-config:
  omniroute-data:

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Galaxy</title>
<style>
  :root {
    --panel: rgba(10, 14, 22, 0.92);
    --line: rgba(120, 160, 210, 0.22);
    --text: #e8eef7;
    --muted: #8ea3bd;
    --accent: #7fe6ff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  /* The starfield is a plain 2D canvas *behind* the WebGL canvas, which is
     rendered with a transparent background. Doing it this way rather than as
     three.js points means it cannot break when the CDN ships a new major
     version of the graph library, and it costs nothing. */
  #stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
  }

  #graph {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  #hud {
    position: fixed;
    left: 18px;
    top: 16px;
    z-index: 3;
    font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    text-shadow: 0 0 12px #000;
  }
  #hud b { color: var(--accent); font-weight: 600; }

  #hint {
    position: fixed;
    left: 50%;
    top: 18px;
    transform: translateX(-50%);
    z-index: 3;
    color: var(--muted);
    font-size: 12px;
    pointer-events: none;
    opacity: 0.75;
    text-shadow: 0 0 12px #000;
  }

  #panel {
    position: fixed;
    right: 0;
    top: 0;
    bottom: 0;
    width: min(420px, 92vw);
    z-index: 4;
    padding: 26px 24px;
    overflow-y: auto;
    background: var(--panel);
    border-left: 1px solid var(--line);
    backdrop-filter: blur(14px);
    transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  #panel.open { transform: translateX(0); }

  #panel h2 {
    margin: 0 0 4px;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  #panel .meta {
    margin: 0 0 18px;
    color: var(--muted);
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  #panel pre {
    margin: 0 0 20px;
    white-space: pre-wrap;
    word-break: break-word;
    font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #cddaeb;
  }
  #panel .links-head {
    margin: 0 0 8px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  #panel .neighbour {
    display: block;
    width: 100%;
    text-align: left;
    margin-bottom: 6px;
    padding: 8px 12px;
    background: rgba(127, 230, 255, 0.07);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  #panel .neighbour:hover { background: rgba(127, 230, 255, 0.16); }

  #close {
    position: absolute;
    right: 16px;
    top: 16px;
    width: 30px;
    height: 30px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
  }
  #close:hover { color: var(--text); }

  #fail {
    position: fixed;
    inset: 0;
    z-index: 9;
    display: none;
    place-content: center;
    padding: 40px;
    text-align: center;
    color: var(--muted);
    font: 13px/1.8 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #fail code { color: var(--accent); }

  /* ---- ask bar ---- */
  #ask {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    z-index: 5;
    width: min(720px, 92vw);
  }
  #ask-row {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 6px 6px 6px 18px;
    background: rgba(12, 18, 27, 0.86);
    border: 1px solid var(--line);
    border-radius: 999px;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, .55);
  }
  #ask-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;          /* 16px or under avoids iOS zoom-on-focus */
    padding: 10px 0;
  }
  #ask-input::placeholder { color: #61748c; }
  #ask-send {
    width: 38px; height: 38px;
    flex: none;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #04121f;
    font-size: 17px;
    cursor: pointer;
  }
  #ask-send:disabled { opacity: .45; cursor: default; }

  #answer {
    margin-bottom: 10px;
    padding: 16px 20px;
    background: rgba(12, 18, 27, 0.92);
    border: 1px solid var(--line);
    border-radius: 16px;
    backdrop-filter: blur(16px);
    line-height: 1.6;
    max-height: 40vh;
    overflow-y: auto;
  }
  #answer.hidden { display: none; }
  #answer .sources {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  #answer .src {
    padding: 5px 11px;
    background: rgba(127, 230, 255, .09);
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
  }
  #answer .src:hover { background: rgba(127, 230, 255, .2); }
  #answer .warn { margin-top: 10px; color: #ffb454; font-size: 12px; }
  #answer .err { color: #ff8a8a; }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div id="graph"></div>

<div id="hud"></div>
<div id="hint">drag to orbit · scroll to zoom · click a star</div>

<aside id="panel">
  <button id="close" aria-label="Close">✕</button>
  <h2 id="p-title"></h2>
  <p class="meta" id="p-meta"></p>
  <pre id="p-excerpt"></pre>
  <p class="links-head" id="p-links-head" hidden>Linked notes</p>
  <div id="p-links"></div>
</aside>


<div id="ask">
  <div id="answer" class="hidden"></div>
  <div id="ask-row">
    <input id="ask-input" type="text" autocomplete="off"
           placeholder="Ask your notes a question…">
    <button id="ask-send" aria-label="Ask">↑</button>
  </div>
</div>

<div id="fail"></div>

<script src="graph-data.js"></script>
<script src="https://unpkg.com/3d-force-graph"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  function die(html) {
    var box = $('fail');
    box.innerHTML = html;
    box.style.display = 'grid';
  }

  if (typeof GRAPH === 'undefined') {
    return die('graph-data.js did not load.<br>Run <code>python3 build.py</code> and reload.');
  }
  if (!GRAPH.nodes || !GRAPH.nodes.length) {
    return die('No notes found in the vault.<br>Check the path passed to <code>build.py</code>.');
  }
  if (typeof ForceGraph3D === 'undefined') {
    return die('The 3d-force-graph library did not load from the CDN.<br>' +
               'The page is served from your server, but the library comes from unpkg —<br>' +
               'so the browser needs internet access, not the server.');
  }

  /* ---------------- starfield ---------------- */
  /* Three parallax layers. The slow one barely moves and reads as distance;
     the fast one is what makes the drift legible at all. */

  var starCanvas = $('stars');
  var sctx = starCanvas.getContext('2d');
  var layers = [
    { count: 260, speed: 0.006, size: 0.7, alpha: 0.42 },
    { count: 130, speed: 0.017, size: 1.1, alpha: 0.62 },
    { count: 45,  speed: 0.035, size: 1.7, alpha: 0.92 }
  ];
  var stars = [];

  function seedStars() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    starCanvas.width = Math.round(window.innerWidth * dpr);
    starCanvas.height = Math.round(window.innerHeight * dpr);
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    stars = [];
    layers.forEach(function (layer) {
      for (var i = 0; i < layer.count; i++) {
        stars.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          r: layer.size * (0.6 + Math.random() * 0.8),
          a: layer.alpha * (0.5 + Math.random() * 0.5),
          v: layer.speed,
          tw: Math.random() * Math.PI * 2
        });
      }
    });
  }

  function drawStars(t) {
    sctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.x -= s.v;
      if (s.x < -2) { s.x = window.innerWidth + 2; s.y = Math.random() * window.innerHeight; }
      // A touch of twinkle. Without it the field looks like a printed texture.
      var a = s.a * (0.75 + 0.25 * Math.sin(t * 0.001 + s.tw));
      sctx.fillStyle = 'rgba(200, 225, 255, ' + a.toFixed(3) + ')';
      sctx.beginPath();
      sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      sctx.fill();
    }
    requestAnimationFrame(drawStars);
  }

  seedStars();
  window.addEventListener('resize', seedStars);
  requestAnimationFrame(drawStars);

  /* ---------------- colours + adjacency ---------------- */

  function hueOf(text) {
    var h = 0;
    for (var i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) >>> 0;
    return h % 360;
  }

  var hues = {};
  GRAPH.nodes.forEach(function (n) {
    if (!(n.group in hues)) hues[n.group] = hueOf(n.group);
  });

  /* Built from the raw numeric ids, before the library is handed the data:
     3d-force-graph replaces link.source/target with node *objects* in place,
     so reading them afterwards means handling both shapes forever. */
  var neighbours = new Map();
  GRAPH.nodes.forEach(function (n) { neighbours.set(n.id, new Set()); });
  GRAPH.links.forEach(function (l) {
    var a = typeof l.source === 'object' ? l.source.id : l.source;
    var b = typeof l.target === 'object' ? l.target.id : l.target;
    if (neighbours.has(a)) neighbours.get(a).add(b);
    if (neighbours.has(b)) neighbours.get(b).add(a);
  });

  var byId = new Map();
  GRAPH.nodes.forEach(function (n) { byId.set(n.id, n); });

  var selected = null;
  var lit = new Set();

  function endpoints(link) {
    return [
      typeof link.source === 'object' ? link.source.id : link.source,
      typeof link.target === 'object' ? link.target.id : link.target
    ];
  }

  /* ---------------- the graph ---------------- */

  var Graph = ForceGraph3D()($('graph'))
    .graphData(GRAPH)
    // Transparent so the starfield shows through from the layer beneath.
    .backgroundColor('rgba(0,0,0,0)')
    .showNavInfo(false)
    .nodeLabel(function (n) { return n.label; })
    .nodeRelSize(5)
    // Longer notes are bigger stars — a cheap way to make the field read as
    // varied rather than uniform, using something real rather than random.
    .nodeVal(function (n) { return 1 + Math.min(6, (n.excerpt || '').length / 160); })
    .nodeOpacity(0.95)
    .nodeResolution(14)
    .nodeColor(function (n) {
      var h = hues[n.group];
      if (selected === null) return 'hsl(' + h + ', 78%, 66%)';
      if (n.id === selected) return '#ffffff';
      if (lit.has(n.id)) return 'hsl(' + h + ', 95%, 74%)';
      return 'hsla(' + h + ', 30%, 40%, 0.30)';
    })
    .linkColor(function (l) {
      if (selected === null) return 'rgba(130, 175, 225, 0.20)';
      var e = endpoints(l);
      var touching = e[0] === selected || e[1] === selected;
      return touching ? 'rgba(127, 230, 255, 0.85)' : 'rgba(120, 160, 210, 0.05)';
    })
    .linkWidth(function (l) {
      var e = endpoints(l);
      return (e[0] === selected || e[1] === selected) ? 1.4 : 0.4;
    })
    // Light travelling along the threads. Built into the library, needs no
    // three.js of our own, and does more for "cinematic" than anything else here.
    .linkDirectionalParticles(function (l) {
      var e = endpoints(l);
      return (selected !== null && (e[0] === selected || e[1] === selected)) ? 4 : 1;
    })
    .linkDirectionalParticleWidth(1.6)
    .linkDirectionalParticleSpeed(0.005)
    .onNodeClick(function (node) { select(node); })
    .onBackgroundClick(function () { clearSelection(); });

  // Spread the layout out a little; the default packs a small vault too tightly
  // to read as a galaxy.
  Graph.d3Force('charge').strength(-140);

  $('hud').innerHTML =
    '<b>' + GRAPH.nodes.length + '</b> notes &nbsp;·&nbsp; ' +
    '<b>' + Object.keys(hues).length + '</b> clusters &nbsp;·&nbsp; ' +
    '<b>' + GRAPH.links.length + '</b> links';

  /* ---------------- selection, camera, panel ---------------- */

  var flying = false;

  function flyTo(node) {
    var dist = 130;
    var span = Math.hypot(node.x || 1, node.y || 1, node.z || 1) || 1;
    var ratio = 1 + dist / span;

    flying = true;
    Graph.cameraPosition(
      { x: (node.x || 0) * ratio, y: (node.y || 0) * ratio, z: (node.z || 0) * ratio },
      node,          // look at the node itself
      1800
    );
    setTimeout(function () { flying = false; }, 1900);
  }

  function select(node) {
    selected = node.id;
    lit = neighbours.get(node.id) || new Set();
    refresh();
    flyTo(node);
    showPanel(node);
  }

  function clearSelection() {
    selected = null;
    lit = new Set();
    refresh();
    $('panel').classList.remove('open');
  }

  function refresh() {
    // Re-running the accessors is how this library is told colours changed.
    Graph.nodeColor(Graph.nodeColor())
         .linkColor(Graph.linkColor())
         .linkWidth(Graph.linkWidth())
         .linkDirectionalParticles(Graph.linkDirectionalParticles());
  }

  function showPanel(node) {
    $('p-title').textContent = node.label;
    $('p-meta').textContent = node.group + ' · node ' + node.id;
    // textContent, never innerHTML: this is the user's own writing and may
    // legitimately contain angle brackets. None of it should ever run.
    $('p-excerpt').textContent = node.excerpt || '(empty note)';

    var box = $('p-links');
    box.innerHTML = '';
    var ids = Array.from(neighbours.get(node.id) || []);
    $('p-links-head').hidden = ids.length === 0;

    ids.slice(0, 40).forEach(function (id) {
      var other = byId.get(id);
      if (!other) return;
      var button = document.createElement('button');
      button.className = 'neighbour';
      button.textContent = other.label;
      button.onclick = function () {
        // The graph's own node objects carry the live x/y/z the camera needs;
        // the ones in GRAPH.nodes are the same objects, mutated in place.
        select(other);
      };
      box.appendChild(button);
    });

    $('panel').classList.add('open');
  }

  $('close').onclick = clearSelection;
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') clearSelection();
  });


  /* ---------------- asking the notes ---------------- */

  var askInput = $('ask-input');
  var askSend  = $('ask-send');
  var answerBox = $('answer');

  // Per-tab, so two windows keep separate conversations and a reload keeps one.
  var session = sessionStorage.getItem('galaxy-session');
  if (!session) {
    session = Math.random().toString(36).slice(2) + Date.now().toString(36);
    sessionStorage.setItem('galaxy-session', session);
  }

  function frameNodes(ids) {
    var chosen = ids.map(function (i) { return byId.get(i); })
                    .filter(function (n) { return n && isFinite(n.x); });
    if (!chosen.length) return;

    selected = chosen.length === 1 ? chosen[0].id : null;
    lit = new Set(ids);
    refresh();

    var mid = { x: 0, y: 0, z: 0 };
    chosen.forEach(function (n) {
      mid.x += n.x / chosen.length; mid.y += n.y / chosen.length; mid.z += n.z / chosen.length;
    });
    // Far enough back that every cited note is in shot. A dive that frames one
    // of six sources is worse than no dive.
    var spread = 90;
    chosen.forEach(function (n) {
      spread = Math.max(spread, Math.hypot(n.x - mid.x, n.y - mid.y, n.z - mid.z));
    });
    var back = Math.max(200, spread * 2.6);
    var span = Math.hypot(mid.x, mid.y, mid.z) || 1;
    var ratio = 1 + back / span;

    flying = true;
    Graph.cameraPosition(
      { x: mid.x * ratio, y: mid.y * ratio, z: mid.z * ratio }, mid, 1800);
    setTimeout(function () { flying = false; }, 1900);
  }

  function renderAnswer(text, ids, warning, isError) {
    answerBox.classList.remove('hidden');
    answerBox.innerHTML = '';

    var body = document.createElement('div');
    if (isError) body.className = 'err';
    // textContent throughout: this is the user's own writing coming back, and
    // it may legitimately contain angle brackets.
    body.textContent = text;
    answerBox.appendChild(body);

    if (ids && ids.length) {
      var row = document.createElement('div');
      row.className = 'sources';
      ids.forEach(function (id) {
        var node = byId.get(id);
        if (!node) return;
        var chip = document.createElement('button');
        chip.className = 'src';
        chip.textContent = node.label;
        chip.onclick = function () { select(node); };
        row.appendChild(chip);
      });
      if (row.children.length) answerBox.appendChild(row);
    }

    if (warning) {
      var warn = document.createElement('div');
      warn.className = 'warn';
      warn.textContent = warning;
      answerBox.appendChild(warn);
    }
  }

  function ask() {
    var question = askInput.value.trim();
    if (!question) return;

    askSend.disabled = true;
    renderAnswer('Reading your notes…', null, null, false);

    fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question: question,
        session: session,
        // Node ids are array positions, so an answer is only meaningful
        // against the graph this page actually loaded. The server compares
        // this and tells us when the vault has moved on.
        generation: GRAPH.generation
      })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
      .then(function (res) {
        if (!res.ok) {
          renderAnswer(res.body.error || 'Something went wrong.', null, null, true);
          return;
        }
        var warning = res.body.stale
          ? 'Your notes changed since this page loaded — the highlighted stars may be wrong. POST /rebuild and reload.'
          : null;
        renderAnswer(res.body.answer, res.body.nodes, warning, false);
        if (!res.body.stale && res.body.nodes && res.body.nodes.length) {
          frameNodes(res.body.nodes);
        }
        askInput.value = '';
      })
      .catch(function (err) {
        renderAnswer('Could not reach the server: ' + err.message, null, null, true);
      })
      .then(function () { askSend.disabled = false; askInput.focus(); });
  }

  askSend.onclick = ask;
  askInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); ask(); }
  });

  /* ---------------- idle drift ---------------- */
  /* The camera turns slowly on its own, and stops the moment you touch it.
     Without the interaction check it fights the orbit controls and the whole
     thing feels broken rather than alive. */

  var lastTouch = 0;
  ['pointerdown', 'wheel', 'touchstart'].forEach(function (evt) {
    $('graph').addEventListener(evt, function () { lastTouch = Date.now(); }, { passive: true });
  });

  setInterval(function () {
    if (flying) return;
    if (Date.now() - lastTouch < 4000) return;

    var p = Graph.cameraPosition();
    var a = 0.0016;
    Graph.cameraPosition({
      x: p.x * Math.cos(a) - p.z * Math.sin(a),
      y: p.y,
      z: p.x * Math.sin(a) + p.z * Math.cos(a)
    });
  }, 30);
})();
</script>
</body>
</html>

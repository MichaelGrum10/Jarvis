<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<title>Jarvis</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/style.css?v=16">
<link rel="stylesheet" href="/static/hud.css?v=16">
</head>
<body>

<div id="login" class="gate">
  <div class="gate-card">
    <div class="logo">J</div>
    <h1>Jarvis</h1>
    <p class="muted">Sign in to this device once.</p>
    <input id="password" type="password" placeholder="Access password" autocomplete="current-password">
    <input id="label" type="text" placeholder="Device name (e.g. iPhone)" autocomplete="off">
    <button id="login-btn">Unlock</button>
    <p id="login-error" class="error"></p>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <button id="menu-btn" class="icon-btn" aria-label="Conversations">☰</button>
    <div class="title">
      <span class="dot" id="status-dot"></span>
      <span>Jarvis</span>
    </div>
    <div class="topbar-actions">
      <button id="mode-btn" class="icon-btn" aria-label="Switch between voice and text" title="Switch mode">⌨</button>
      <button id="loc-btn" class="icon-btn" aria-label="Share location" title="Share location">◎</button>
      <button id="new-btn" class="icon-btn" aria-label="New conversation">＋</button>
    </div>
  </header>

  <aside id="drawer" class="drawer">
    <div class="drawer-head">
      <strong>Conversations</strong>
      <button id="drawer-close" class="icon-btn">✕</button>
    </div>
    <div id="conv-list" class="conv-list"></div>
    <div class="drawer-foot">
      <button id="hud-btn" class="ghost-btn">◎ Open HUD (voice)</button>
      <button id="galaxy-btn" class="ghost-btn">✧ Knowledge galaxy</button>
      <button id="skills-btn" class="ghost-btn">✦ Skills</button>
      <button id="cookies-btn" class="ghost-btn">🍪 Browser session</button>
      <button id="voice-btn" class="ghost-btn">🔊 Voice</button>
      <button id="auto-btn" class="ghost-btn">⚙ Self-improve</button>
      <button id="status-btn" class="ghost-btn">Status</button>
      <button id="logout-btn" class="ghost-btn danger">Sign out</button>
    </div>
  </aside>
  <div id="scrim" class="scrim"></div>

  <main id="messages" class="messages">
    <div class="welcome">
      <div class="logo big">J</div>
      <h2>Good to see you.</h2>
      <div class="suggestions">
        <button class="chip">What's on my calendar today?</button>
        <button class="chip">Anything important in my inbox?</button>
        <button class="chip">WSJ markets headlines</button>
        <button class="chip">How's NVDA doing?</button>
        <button class="chip">I need a haircut</button>
        <button class="chip">Any messages I should reply to?</button>
      </div>
    </div>
  </main>

  <div id="hud" class="hud hidden" data-state="idle">
    <div id="hud-alert" class="hud-alert hidden"></div>

    <div id="hud-stage" class="hud-stage" role="button" tabindex="0"
         aria-label="Tap to speak to Jarvis">
      <svg class="hud-ring spin-slow" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-track" cx="100" cy="100" r="94"/>
        <circle class="ring-outer" cx="100" cy="100" r="88" stroke-dasharray="2 10"/>
        <path class="ring-sweep" d="M100 12 A88 88 0 0 1 172 52"/>
        <path class="ring-accent" d="M28 148 A88 88 0 0 0 62 180"/>
      </svg>

      <svg class="hud-ring spin-reverse" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-track" cx="100" cy="100" r="76"/>
        <g class="ring-ticks" id="hud-ticks"></g>
        <path class="ring-sweep" d="M100 24 A76 76 0 0 1 152 46" opacity="0.75"/>
      </svg>

      <svg class="hud-ring spin-slow" viewBox="0 0 200 200" aria-hidden="true"
           style="--spin: 68s">
        <circle class="ring-outer" cx="100" cy="100" r="66" stroke-dasharray="1 6"/>
      </svg>

      <div class="hud-core">
        <span class="hud-label">J.A.R.V.I.S.</span>
      </div>
    </div>

    <div id="hud-status" class="hud-status">Tap to speak</div>

    <!-- Panels flank the reactor on a wide screen and stack under it on a
         phone. They refresh on their own timers and never call the model. -->
    <div class="hud-panels">
      <section class="hud-panel" id="panel-markets">
        <h3>Markets <span class="dot-status" data-for="markets"></span></h3>
        <div class="panel-body"></div>
      </section>
      <section class="hud-panel" id="panel-briefing">
        <h3>Briefing <span class="dot-status" data-for="calendar"></span></h3>
        <div class="panel-body"></div>
      </section>
    </div>

    <div class="hud-actions">
      <button id="hud-enroll" class="hud-btn">Enrol voice</button>
      <button id="hud-galaxy" class="hud-btn">Galaxy</button>
      <button id="hud-exit" class="hud-btn">Text mode</button>
    </div>
  </div>

  <div id="voice-panel" class="voice-panel hidden">
    <div id="voice-transcript" class="voice-transcript"></div>
    <button id="voice-orb" class="voice-orb" aria-label="Hold to speak">
      <span class="orb-ring"></span>
      <span class="orb-icon">🎙</span>
    </button>
    <div id="voice-hint" class="voice-hint">Tap to speak</div>
    <div class="voice-actions">
      <button id="voice-stop" class="ghost-btn hidden">■ Stop speaking</button>
      <button id="voice-to-text" class="ghost-btn">⌨ Type instead</button>
    </div>
  </div>

  <form id="composer" class="composer">
    <button id="mic-btn" type="button" class="icon-btn mic" aria-label="Dictate">🎙</button>
    <textarea id="input" rows="1" placeholder="Ask Jarvis…" autocomplete="off"></textarea>
    <button id="send" type="submit" aria-label="Send">↑</button>
  </form>
</div>

<!-- The galaxy sits above everything: it is a place you go, not a panel you
     glance at, and it has to own the whole screen to read as depth. -->
<div id="galaxy" class="galaxy hidden">
  <!-- Two layers: a 2D starfield beneath, the WebGL graph above it with a
       transparent background. Keeping the backdrop out of three.js means a
       library upgrade can't take it with it. -->
  <canvas id="galaxy-stars"></canvas>
  <div id="galaxy-graph"></div>
  <div class="galaxy-bar">
    <input id="galaxy-search" type="search" placeholder="Find a note by name…"
           autocomplete="off" autocapitalize="none">
    <button id="galaxy-reset" class="icon-btn" title="Show everything">⤢</button>
    <button id="galaxy-close" class="icon-btn" aria-label="Close galaxy">✕</button>
  </div>
  <div id="galaxy-status" class="galaxy-status hidden"></div>

  <!-- Ask the vault from inside the galaxy. The answer names its sources and
       the camera flies to them. -->
  <div id="galaxy-ask">
    <div id="galaxy-answer" class="hidden"></div>
    <div class="ask-row">
      <input id="ask-input" type="text" autocomplete="off" autocapitalize="sentences"
             placeholder="Ask your notes…">
      <button id="ask-send" aria-label="Ask">↑</button>
    </div>
  </div>

  <div id="galaxy-note" class="galaxy-note hidden"></div>
</div>

<!-- Requirement 8: both the microphone and speechSynthesis need a secure
     context, and on plain HTTP both fail with no error of any kind. -->
<div id="insecure" class="insecure hidden"></div>

<!-- Requirement 2: Safari will not speak until a gesture has primed the audio
     engine, so the page cannot greet you on load. This asks for that gesture
     once, with the galaxy visible behind it, and the greeting follows the tap. -->
<div id="wake-gate" class="wake-gate hidden">
  <div class="wake-inner">
    <div class="wake-ring"></div>
    <p class="wake-title">Tap to wake Jarvis</p>
    <p class="wake-sub">Safari needs one tap before it will speak.</p>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <strong id="modal-title">Title</strong>
      <button id="modal-close" class="icon-btn">✕</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<!-- Startup failures are otherwise invisible: a module that throws leaves every
     handler unbound, so the page renders normally and no button does anything.
     "It won't let me click unlock" is what that looks like from outside. This
     puts the actual error on screen where it can be read and reported. -->
<script>
(function () {
  var shown = false;
  // A mismatched pair of cached modules produces exactly this: one file fresh,
  // one stale, and an import that no longer resolves. Clearing and reloading
  // once fixes it, and there is no version of this the user could fix by hand.
  function healOnce(what) {
    if (!/Importing binding|SyntaxError|Failed to fetch dynamically imported/.test(what)) return false;
    if (sessionStorage.getItem('jarvis_healed')) return false;   // never loop
    sessionStorage.setItem('jarvis_healed', '1');
    var done = function () { location.reload(); };
    var jobs = [];
    if (window.caches) jobs.push(caches.keys().then(function (keys) {
      return Promise.all(keys.map(function (k) { return caches.delete(k); }));
    }));
    if (navigator.serviceWorker) jobs.push(
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      })
    );
    Promise.all(jobs).then(done, done);
    return true;
  }

  function show(what) {
    if (shown) return;
    shown = true;
    if (healOnce(what)) return;
    var bar = document.createElement('div');
    bar.setAttribute('role', 'alert');
    bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;'
      + 'background:#3a1113;color:#ffd7d7;font:12px/1.4 ui-monospace,monospace;'
      + 'padding:10px 12px;max-height:40vh;overflow:auto;border-top:1px solid #ff5f56';
    bar.textContent = 'Jarvis failed to start: ' + what
      + ' — reload, and if it persists send this line.';
    document.body.appendChild(bar);
  }
  window.addEventListener('error', function (e) {
    show((e.message || 'script error') + (e.filename ? ' @ ' + e.filename.split('/').pop()
      + ':' + e.lineno : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    show(String((e.reason && e.reason.message) || e.reason || 'promise rejected'));
  });
  // A module that never runs is the case a plain error handler misses: the
  // failure is a load error, not a thrown one.
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (!window.__jarvisStarted) {
        show('the app script did not run (a load or syntax error)');
      }
    }, 3000);
  });
})();
</script>
<script type="module" src="/static/app.js?v=16"></script>
</body>
</html>

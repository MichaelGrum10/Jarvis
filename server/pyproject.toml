[build-system]
# Declared explicitly: recent Python base images ship without setuptools, and
# relying on pip's implicit fallback makes the Docker build depend on undeclared
# behaviour.
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Self-hosted personal AI assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "python-multipart>=0.0.12",
    "caldav>=1.3",
    "icalendar>=6.0",
    "vobject>=0.9.7",
    "yfinance>=0.2.50",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "python-dateutil>=2.9",
    "tzdata>=2024.2",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "ormsgpack>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "respx>=0.21",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
